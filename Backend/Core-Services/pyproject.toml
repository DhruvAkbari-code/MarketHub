[project]
name = "core-services"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dhruv Akbari", email = "ad.dhruvakbari@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "beanie>=2.2.0",
    "cloudinary>=1.46.3",
    "fastapi[standard]>=0.143.0",
    "google-auth>=2.62.0",
    "psycopg>=3.3.6",
    "pydantic>=2.14.1",
    "pyjwt>=2.15.1",
    "pymongo>=4.18.3",
    "python-multipart>=0.0.32",
    "python-slugify>=9.1.3",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.1.4",
    "sqlmodel>=0.0.48",
]

[project.scripts]
core-services = "core_services:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
